<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff3b6b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- angry eyebrows -->
  <rect x="14" y="20" width="14" height="5" rx="2.5" fill="#0d0b1a" transform="rotate(20 21 22)"/>
  <rect x="36" y="20" width="14" height="5" rx="2.5" fill="#0d0b1a" transform="rotate(-20 43 22)"/>
  <!-- eyes -->
  <circle cx="23" cy="30" r="3.4" fill="#0d0b1a"/>
  <circle cx="41" cy="30" r="3.4" fill="#0d0b1a"/>
  <!-- shouting mouth -->
  <rect x="24" y="40" width="16" height="13" rx="6" fill="#0d0b1a"/>
  <rect x="27" y="43" width="10" height="4" rx="2" fill="#ff3b6b"/>
</svg>
